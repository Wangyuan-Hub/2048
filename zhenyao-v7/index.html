<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>山海经 镇妖录 · 网页体验版</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#faf8ef; }
  body { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
  #game-root { width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
  #game-canvas { display:block; background:#faf8ef; box-shadow:0 16px 40px rgba(119,110,101,.22); border-radius:12px; }
  #demo-badge {
    position:fixed; left:10px; bottom:10px; z-index:50; pointer-events:none;
    background:rgba(60,58,50,.58); color:#fff; font-size:11px;
    padding:4px 9px; border-radius:10px; letter-spacing:.5px;
  }
  #boss-select {
    position:fixed; right:10px; bottom:10px; z-index:60; display:flex;
    align-items:center; gap:5px; background:rgba(60,58,50,.72);
    padding:6px 8px; border-radius:12px; color:#fff; font-size:10px;
  }
  #boss-select button {
    border:none; border-radius:7px; padding:5px 7px; font-size:11px;
    font-family:inherit; background:#edc22e; color:#776e65; font-weight:700; cursor:pointer;
  }
  @media (max-width:600px) { #boss-select { bottom:38px; } }
  #ad-overlay {
    position:fixed; inset:0; z-index:9999; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(0,0,0,.58);
  }
  #ad-overlay.show { display:flex; }
  .ad-card {
    width:min(360px,100%); background:#fff; border-radius:18px;
    padding:24px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.28);
  }
  .ad-card h2 { margin:0 0 8px; color:#776e65; font-size:22px; }
  .ad-card p { margin:0 0 18px; color:#8f8377; font-size:14px; line-height:1.7; }
  .ad-card button {
    border:none; border-radius:8px; padding:11px 18px; margin:4px;
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
  }
  #ad-finish { background:#edc22e; color:#776e65; }
  #ad-cancel { background:#d6cdc4; color:#776e65; }
  @media (max-width:600px) {
    #game-canvas { border-radius:0; box-shadow:none; }
  }
  #version-stamp {
    position:fixed; top:8px; right:8px; z-index:70; pointer-events:none;
    background:#c94c4c; color:#fff; font-size:12px; font-weight:700;
    padding:4px 9px; border-radius:9px; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }  #audio-toggle {
    position:fixed; top:8px; left:8px; z-index:70; border:none;
    background:#8f7a66; color:#fff; font-family:inherit; font-size:12px;
    font-weight:700; padding:6px 10px; border-radius:9px; cursor:pointer;
  }
  #error-banner {
    display:none; position:fixed; top:44px; left:8px; right:8px; z-index:99999;
    background:#c94c4c; color:#fff; padding:8px 10px; border-radius:8px;
    font-size:12px; white-space:pre-wrap;
  }
</style>
</head>
<body>
<div id="version-stamp">v0.7</div>
<button id="audio-toggle">音效：开</button>
<div id="error-banner"></div>
<div id="game-root"></div>
<div id="demo-badge">v0.7 · 网页体验版 · 卡顿修复 · 模拟广告</div>
<div id="boss-select">
  <span>试玩Boss</span>
  <button data-boss="0">饕餮</button>
  <button data-boss="1">穷奇</button>
  <button data-boss="2">烛龙</button>
</div>
<div id="ad-overlay">
  <div class="ad-card">
    <h2>模拟激励视频</h2>
    <p>这是网页体验版的模拟广告。<br>点击“看完了，复活”即可体验复活流程。</p>
    <button id="ad-finish">看完了，复活</button>
    <button id="ad-cancel">放弃复活</button>
  </div>
</div>
<script>
(function(){
  var banner=document.getElementById('error-banner');
  function show(msg){ banner.textContent='运行错误：'+msg; banner.style.display='block'; }
  window.addEventListener('error',function(e){ show(e.message || '未知错误'); });
  window.addEventListener('unhandledrejection',function(e){ show((e.reason && e.reason.message) || '异步错误'); });
})();
</script>
<script src="tt-shim.js?v=7"></script>
<script src="game.js?v=7"></script>
<script>
(function(){
  var btn=document.getElementById('audio-toggle');
  var on=true;
  btn.addEventListener('click',function(){
    on=!on;
    btn.textContent=on?'音效：开':'音效：关';
    if(window.__zhenyaoSetSound) window.__zhenyaoSetSound(on);
  });
})();
</script>

<script>
window.addEventListener('load', function () {
  document.querySelectorAll('#boss-select button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (window.__zhenyaoStartBoss) window.__zhenyaoStartBoss(Number(btn.dataset.boss));
    });
  });
});
</script>

</body>
</html>
